packages:
  - apps/*
  - packages/*

engineStrict: true
allowBuilds:
  esbuild: true
peerDependencyRules:
  allowedVersions:
    # Vite+ bundles a Vite-compatible fork with its own version number.
    vite: "1"
overrides:
  # Dependabot does not update this alias. Run `vp migrate` after each vite-plus bump.
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
saveExact: true
patchedDependencies:
  react-native-screens@4.30.0: patches/react-native-screens@4.30.0.patch
