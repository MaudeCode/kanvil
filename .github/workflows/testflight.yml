name: TestFlight

# Signing, the build number, the export, its verification and the upload come from the shared actions in
# MaudeCode/.github (IOS.md there). This workflow keeps only what is Kanvil's own: Expo's native project, its app
# target's signing settings, the archive and the checks of Kanvil's bundle.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      sha:
        description: The commit to publish, from the release preflight.
        type: string
        required: true
      upload:
        description: Upload to TestFlight. Off, the run proves a verified signed IPA and publishes nothing.
        type: boolean
        default: true
  # A dry run: builds, signs and verifies the IPA without the testflight environment and without uploading.
  workflow_dispatch:
    inputs:
      version:
        description: The marketing version to build, such as 1.2.3.
        type: string
        required: true
      sha:
        description: The full SHA of the commit to build.
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish iOS to TestFlight
    runs-on: xcode-27
    # The deployment gate (main and v* tags) applies to the upload; a dry run needs no environment.
    environment: ${{ inputs.upload && 'testflight' || '' }}
    timeout-minutes: 60
    concurrency:
      group: kanvil-testflight
      cancel-in-progress: false
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      KANVIL_IOS_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "27.1"
      - name: Resolve app identity
        run: |
          bundle=$(node --input-type=module -e "import config from './apps/mobile/app.config.ts'; console.log(config.ios.bundleIdentifier)")
          echo "BUNDLE_ID=$bundle" >> "$GITHUB_ENV"
      # A re-run for the same version and commit gets the number it already uploaded.
      - id: number
        uses: MaudeCode/.github/actions/ios-build-number@8af350cd57de98d7f6b4ede375cf8f360fb121a3
        with:
          bundle-id: ${{ env.BUNDLE_ID }}
          version: ${{ inputs.version }}
          commit: ${{ inputs.sha }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      - id: signing
        uses: MaudeCode/.github/actions/ios-signing@8af350cd57de98d7f6b4ede375cf8f360fb121a3
        with:
          certificate-p12-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          bundle-ids: ${{ env.BUNDLE_ID }}
      - name: Generate native project
        env:
          KANVIL_IOS_BUILD_NUMBER: ${{ steps.number.outputs.build-number }}
        run: |
          pnpm --filter @kanvil/mobile exec expo prebuild --platform ios --no-install
          cd apps/mobile/ios
          pod install
      - name: Archive
        env:
          TEAM_ID: ${{ steps.signing.outputs.team-id }}
          PROFILE_NAME: ${{ fromJSON(steps.signing.outputs.profiles)[env.BUNDLE_ID] }}
        run: |
          set -euo pipefail
          # Set signing on the app target only; Pods must not receive its profile.
          pnpm --filter @kanvil/mobile exec node <<'JS'
          const { writeFileSync } = require('node:fs');
          const { XcodeUtils } = require('expo/config-plugins').IOSConfig;
          const project = XcodeUtils.getPbxproj(process.cwd());
          const { target } = XcodeUtils.getApplicationNativeTarget({ project, projectName: 'Kanvil' });
          for (const [, configuration] of XcodeUtils.getBuildConfigurationsForListId(project, target.buildConfigurationList)) {
            Object.assign(configuration.buildSettings, {
              CODE_SIGN_STYLE: 'Manual', CODE_SIGN_IDENTITY: '"Apple Distribution"',
              DEVELOPMENT_TEAM: process.env.TEAM_ID,
              PROVISIONING_PROFILE_SPECIFIER: JSON.stringify(process.env.PROFILE_NAME)
            });
          }
          writeFileSync('ios/Kanvil.xcodeproj/project.pbxproj', project.writeSync());
          JS
          xcodebuild archive -workspace apps/mobile/ios/Kanvil.xcworkspace -scheme Kanvil \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Kanvil.xcarchive" -derivedDataPath "$RUNNER_TEMP/DerivedData"
      - name: Verify Kanvil's bundle
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Kanvil.xcarchive/Products/Applications/Kanvil.app"
          [[ "$(plutil -extract CFBundleSupportedPlatforms.0 raw -o - "$app/Info.plist")" == iPhoneOS ]]
          [[ "$(plutil -extract ITSAppUsesNonExemptEncryption raw -o - "$app/Info.plist")" == false ]]
          [[ -s "$app/main.jsbundle" ]]
          node scripts/verify-ios-tabs.ts "$app/Kanvil"
      - uses: MaudeCode/.github/actions/ios-publish@8af350cd57de98d7f6b4ede375cf8f360fb121a3
        with:
          archive: ${{ runner.temp }}/Kanvil.xcarchive
          export-options: ${{ steps.signing.outputs.export-options }}
          bundle-id: ${{ env.BUNDLE_ID }}
          version: ${{ inputs.version }}
          build-number: ${{ steps.number.outputs.build-number }}
          commit: ${{ steps.number.outputs.commit }}
          upload: ${{ inputs.upload }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
