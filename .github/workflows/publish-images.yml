name: Publish images

# Publishes the native amd64 and arm64 images a CI run tested, for a stable release or an
# experimental build. scripts/release-publish.ts owns the names and the rerun rules.
on:
  workflow_call:
    inputs:
      channel:
        description: stable or experimental
        required: true
        type: string
      version:
        required: true
        type: string
      revision:
        description: The full commit the images were built from.
        required: true
        type: string
      run-id:
        description: The CI run holding the tested images, when it is not this run.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  image:
    name: Publish Docker (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - &setup
        uses: ./.github/actions/setup
        with:
          install: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-release-${{ matrix.arch }}
          path: release
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ inputs.run-id && github.token || '' }}
      - &login
        name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push the tested image and record its digest
        env:
          KANVIL_RELEASE_CHANNEL: ${{ inputs.channel }}
          KANVIL_VERSION: ${{ inputs.version }}
          KANVIL_REVISION: ${{ inputs.revision }}
          ARCH: ${{ matrix.arch }}
        run: node scripts/release-publish.ts image
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-digest-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error

  manifest:
    name: Publish multi-platform Docker tags
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - *checkout
      - *setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-digest-*
          path: digests
          merge-multiple: true
      - *login
      - name: Join the tested digests under the release tags
        env:
          KANVIL_RELEASE_CHANNEL: ${{ inputs.channel }}
          KANVIL_VERSION: ${{ inputs.version }}
          KANVIL_REVISION: ${{ inputs.revision }}
        run: node scripts/release-publish.ts manifest
