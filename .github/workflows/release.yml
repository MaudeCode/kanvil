name: Release
run-name: Release ${{ inputs.tag }}

# Tag last (RELEASES.md in MaudeCode/.github): a dispatch names the version and, optionally, the
# main commit (empty releases main's head when the run started; jobs read preflight's sha output),
# every publisher accepts what an earlier attempt already published from that commit, and the
# vX.Y.Z tag is created only after all of them succeed. A failed release leaves no tag, so the
# same version is released again. See docs/releasing.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, such as v1.2.3
        required: true
        type: string
      sha:
        description: Full SHA of the main commit to release; empty for the head of main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - id: check
        uses: MaudeCode/.github/actions/release-preflight@3e8fc1995784e2d3004e4de05205a767472efb7c
        with:
          tag: ${{ inputs.tag }}
          sha: ${{ inputs.sha }}

  # CI builds the release version through scripts/release-version.ts, which refuses prerelease
  # versions and v0.0.0, so they fail here before any publisher starts.
  validate:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      tag: ${{ inputs.tag }}
      sha: ${{ needs.preflight.outputs.sha }}

  npm:
    name: Publish npm
    needs: [preflight, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: release
      - name: Publish tested tarball with npm OIDC
        env:
          KANVIL_RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/publish-npm.mjs

  images:
    needs: [preflight, validate]
    uses: ./.github/workflows/publish-images.yml
    permissions:
      actions: read
      contents: read
      packages: write
    with:
      channel: stable
      version: ${{ needs.preflight.outputs.version }}
      revision: ${{ needs.preflight.outputs.sha }}

  # TestFlight records no source commit, so iOS waits for the publishers that do: once npm and
  # the images accept this commit for the version, an upload cannot be from another commit.
  ios:
    needs: [preflight, npm, images]
    uses: ./.github/workflows/testflight.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      sha: ${{ needs.preflight.outputs.sha }}
    secrets: inherit

  release:
    name: Tag and create GitHub release
    needs: [preflight, npm, images, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: MaudeCode/.github/actions/release-tag@3e8fc1995784e2d3004e4de05205a767472efb7c
        with:
          tag: ${{ inputs.tag }}
          sha: ${{ needs.preflight.outputs.sha }}
          message: Kanvil ${{ needs.preflight.outputs.version }}
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
