name: Release
run-name: Release ${{ inputs.tag }}

# Tag last (RELEASES.md in MaudeCode/.github): a dispatch names the version and, optionally, any
# main commit after the last release (empty releases main's head when the run started; jobs read
# preflight's sha output, never github.sha), every publisher accepts what an earlier attempt
# already published from that commit, and the vX.Y.Z tag is created only after all of them
# succeed. A failed release leaves no tag, so the same version is released again. See
# docs/releasing.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, such as v1.2.3
        required: true
        type: string
      sha:
        description: Full SHA of the main commit to release, after the last release; empty for the head of main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to find the commit's CI Checks that already passed
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - id: check
        uses: MaudeCode/.github/actions/release-preflight@7142f8bc63e5e63cdc7d0c4605f3a283de59624c
        with:
          tag: ${{ inputs.tag }}
          sha: ${{ inputs.sha }}
          checks: |
            ci.yml: Checks

  # GitHub refuses this run's token to tag a commit whose workflow files differ from main's, so
  # fail the release-freeze status on every open PR that changes a workflow file until thaw. The
  # first publishers (npm, images) need it, and ios and release need them: a release that could
  # not freeze publishes nothing.
  freeze:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { statuses: write, pull-requests: read, actions: read }
    steps:
      - uses: MaudeCode/.github/actions/release-freeze@20b180ba0237e316fcc65d83ed4e8f19ac5e16a7
        with: { mode: start }

  # CI on the commit preflight resolved. When the commit's push run already passed Checks, only
  # the jobs that build and test what this release publishes run (verified): the npm tarball and
  # the native images carry the release version, so no push run built them. Otherwise the whole
  # workflow runs here; the release never waits on the push run. scripts/release-version.ts
  # refuses prerelease versions and v0.0.0 in the build, before any publisher starts.
  validate:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      tag: ${{ inputs.tag }}
      revision: ${{ needs.preflight.outputs.sha }}
      verified: ${{ needs.preflight.outputs.verified == 'true' }}

  npm:
    name: Publish npm
    needs: [preflight, freeze, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: release
      - name: Publish tested tarball with npm OIDC
        env:
          KANVIL_RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/publish-npm.mjs

  images:
    needs: [preflight, freeze, validate]
    uses: ./.github/workflows/publish-images.yml
    permissions:
      actions: read
      contents: read
      packages: write
    with:
      channel: stable
      version: ${{ needs.preflight.outputs.version }}
      revision: ${{ needs.preflight.outputs.sha }}

  # TestFlight records no source commit, so iOS waits for the publishers that do: once npm and
  # the images accept this commit for the version, an upload cannot be from another commit.
  ios:
    needs: [preflight, npm, images]
    uses: ./.github/workflows/testflight.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      sha: ${{ needs.preflight.outputs.sha }}
    secrets: inherit

  release:
    name: Tag and create GitHub release
    needs: [preflight, npm, images, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: MaudeCode/.github/actions/release-tag@7142f8bc63e5e63cdc7d0c4605f3a283de59624c
        with:
          tag: ${{ inputs.tag }}
          sha: ${{ needs.preflight.outputs.sha }}
          message: Kanvil ${{ needs.preflight.outputs.version }}
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi

  # Pass release-freeze again however the release ended.
  thaw:
    needs: [freeze, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { statuses: write, pull-requests: read, actions: read }
    steps:
      - uses: MaudeCode/.github/actions/release-freeze@20b180ba0237e316fcc65d83ed4e8f19ac5e16a7
        with: { mode: end }
