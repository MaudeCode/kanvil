name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version and main ancestry
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$version"
          test "$version" != "0.0.0"
          git merge-base --is-ancestor HEAD origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  npm:
    name: Publish npm
    needs: [preflight, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: release
      - name: Publish tested tarball with npm OIDC
        run: node scripts/publish-npm.mjs

  docker:
    name: Publish Docker (${{ matrix.arch }})
    needs: [preflight, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-release-${{ matrix.arch }}
          path: release
      - &login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image and record its digest
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker load --input release/image.tar.gz
          test "$(docker image inspect kanvil:local --format '{{.Architecture}}')" = "$ARCH"
          test "$(docker image inspect kanvil:local --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect kanvil:local --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VERSION"
          image="ghcr.io/maudecode/kanvil:$VERSION-$ARCH"
          docker tag kanvil:local "$image"
          docker push "$image"
          mkdir digests
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' > "digests/$ARCH"
          grep -Ex 'ghcr.io/maudecode/kanvil@sha256:[0-9a-f]{64}' "digests/$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-digest-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error

  manifest:
    name: Publish multi-platform Docker tags
    needs: [preflight, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - *login
      - name: Publish version and latest manifests from tested digests
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/maudecode/kanvil:$VERSION" \
            --tag ghcr.io/maudecode/kanvil:latest \
            "$(cat digests/amd64)" "$(cat digests/arm64)"
          docker buildx imagetools inspect "ghcr.io/maudecode/kanvil:$VERSION"
