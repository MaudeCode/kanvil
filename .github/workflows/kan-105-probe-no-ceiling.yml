name: KAN-105 probe (no-ceiling)

# Temporary: calls ci.yml the way release.yml's validate job does, with caller permissions
# { contents: read }. Removed before merge.
on: pull_request

permissions:
  contents: read

jobs:
  ci:
    permissions: { contents: read }
    uses: ./.github/workflows/ci.yml
    with:
      tag: v9.9.6
      revision: ${{ github.event.pull_request.head.sha }}
      verified: true
