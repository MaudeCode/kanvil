name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kanvil
          POSTGRES_PASSWORD: kanvil
          POSTGRES_DB: kanvil
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanvil -d kanvil"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://kanvil:kanvil@127.0.0.1:5432/kanvil
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+, Node, and pnpm
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          cache-save: ${{ github.event_name == 'push' }}
          run-install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build web application
        run: pnpm build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser workflows
        run: pnpm exec playwright test
