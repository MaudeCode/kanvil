name: KAN-104 probe (verified)

# Temporary: runs ci.yml as a release with verified: true calls it, on an earlier main commit
# (46e04eb, v0.9.2), and checks the built image and tarball identify that commit and version.
# Removed before merge.
on: pull_request

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      tag: v9.9.8
      revision: 46e04ebbc267cdcf3d8239ea23f557a312d18415
      verified: true

  identity:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-release-amd64
          path: built/docker-release-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: built/npm-release
      - name: The image and tarball are the earlier commit at the release version
        run: |
          docker load --input built/docker-release-amd64/image.tar.gz
          labels=$(docker image inspect kanvil:local --format '{{json .Config.Labels}}')
          echo "$labels" | jq .
          echo "$labels" | jq -e '."org.opencontainers.image.revision" == "46e04ebbc267cdcf3d8239ea23f557a312d18415"'
          echo "$labels" | jq -e '."org.opencontainers.image.version" == "9.9.8"'
          ls built/npm-release
          test -f "built/npm-release/maudecode-kanvil-9.9.8.tgz"
